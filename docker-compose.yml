services:
  db:
    image: postgres:15
    container_name: pdp_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/
    ports:
      - 5432:5432
    volumes:
      - db:/var/lib/postgresql/data/
    networks:
      - net
volumes:
  db:
networks:
  net:
    driver: bridge